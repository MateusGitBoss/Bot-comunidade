[project]
name = "bot"
version = "0.1.0"
description = "Bot de Discord que responde dúvidas da comunidade com IA (base de FAQ) e consulta status de compra."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mateus", email = "mateusknc@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "discord-py>=2.4",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.15.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
bot = "bot.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["N818"]  # nomes de exceção em português

[tool.mypy]
python_version = "3.12"
packages = ["bot"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --cov=bot --cov-report=term-missing"
