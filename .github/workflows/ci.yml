name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TESTE: postgresql://postgres:postgres@localhost:5432/bot_teste
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tipos
        run: uv run mypy
      - name: Testes
        run: uv run pytest

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build da imagem Docker
        run: docker build -t bot-comunidade .
