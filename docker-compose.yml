# Sobe Postgres + bot. Preencha o .env antes (veja .env.example).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bot
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10
    volumes: [dados:/var/lib/postgresql/data]

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bot
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dados:
